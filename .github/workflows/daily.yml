name: AIRadar 每日扫描

on:
  schedule:
    # UTC 23:00 = 北京时间 07:00，早上起来就有当天的情报
    - cron: '0 23 * * *'
  workflow_dispatch: # 允许手动触发（调试与首次验证）
    inputs:
      open_review:
        description: '不管今天星期几，都开一张审批单'
        type: boolean
        default: false

# 需要写权限把数据 commit 回仓库 / 开审批 issue（零服务器架构，见 docs/decisions.md D3）
# pages / id-token 给同一工作流里的部署 job 用（见文件末尾的说明）
permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: airadar-daily
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - run: pip install -r requirements.txt

      - name: 读取 HITL 审批结果（上一轮人工勾选）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 -m pipeline.hitl collect

      - name: 跑 pipeline
        env:
          AIRADAR_LLM_BASE_URL: ${{ vars.AIRADAR_LLM_BASE_URL }}
          AIRADAR_LLM_API_KEY: ${{ secrets.AIRADAR_LLM_API_KEY }}
          AIRADAR_LLM_MODEL: ${{ vars.AIRADAR_LLM_MODEL }}
          AIRADAR_FALLBACK_BASE_URL: ${{ vars.AIRADAR_FALLBACK_BASE_URL }}
          AIRADAR_FALLBACK_API_KEY: ${{ secrets.AIRADAR_FALLBACK_API_KEY }}
          AIRADAR_FALLBACK_MODEL: ${{ vars.AIRADAR_FALLBACK_MODEL }}
        run: python3 -m pipeline.main

      - name: 跑评测（规则校验不过就让这次运行显红）
        run: python3 evals/run_eval.py

      # 抓取每天跑，审批每周一次（北京时间周一早上），每次只列分数最高的 12 条（D37）。
      # 放在同一个工作流里而不是另开一个：回收、开单、数据回写要按顺序发生在同一次运行里
      - name: 开本周审批 issue（北京时间周一）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          FORCE: ${{ inputs.open_review }}
        run: |
          if [ "$(TZ=Asia/Shanghai date +%u)" = "1" ] || [ "$FORCE" = "true" ]; then
            python3 -m pipeline.hitl open
          else
            echo "今天不是审批日（北京时间周一），跳过"
          fi

      # 回写要能容忍"运行期间远端已变化"——一次扫描要跑十几分钟，
      # 期间任何一次人工 push 都会让直接 push 被拒（实测踩过）。
      # 策略：本次运行产出的数据是权威版本，直接覆盖到远端最新代码之上，
      # 不走 merge/rebase（knowledge.db 是二进制，冲突无法自动解）。
      - name: 数据回写仓库
        run: |
          git config user.name  "airadar-bot"
          git config user.email "airadar-bot@users.noreply.github.com"
          git add data/ evals/results/
          if git diff --staged --quiet; then
            echo "本次无数据变更，跳过回写"; exit 0
          fi
          mkdir -p /tmp/airadar-out
          cp -r data /tmp/airadar-out/
          cp -r evals/results /tmp/airadar-out/
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            rm -rf data evals/results
            cp -r /tmp/airadar-out/data data
            cp -r /tmp/airadar-out/results evals/results
            git add data/ evals/results/
            git diff --staged --quiet && { echo "与远端一致，无需提交"; exit 0; }
            git commit -m "扫描 $(date -u +%Y-%m-%d)"
            if git push; then echo "回写成功（第 $attempt 次尝试）"; exit 0; fi
            echo "推送被拒，远端有新提交，重试中…"; sleep 5
          done
          echo "::error::数据回写重试 3 次仍失败"; exit 1

  # ---------- 部署前端 ----------
  # 为什么放在这里而不是交给 pages.yml 的 push 触发：上面的回写用的是 GITHUB_TOKEN，
  # 按 GitHub 的规则，GITHUB_TOKEN 产生的提交不会触发任何其他工作流（防止无限循环）。
  # 结果是 pages.yml 从 08-29 之后再没被触发过，线上数据停在那天，仓库里却每天都有新提交。
  build:
    needs: scan
    runs-on: ubuntu-latest
    steps:
      # 必须显式检出 main：默认检出的是触发本次运行的那个提交，
      # 也就是 scan 回写数据之前的版本——部署出去的还是旧数据
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          AIRADAR_BASE: /airadar/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # 与 pages.yml 的手动部署共用一个并发组，避免两边同时发布
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
