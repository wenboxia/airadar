name: 部署前端到 GitHub Pages

# 日常部署已经并入 daily.yml（scan → build → deploy）。
# 这里原本监听 push，但每日数据是 GITHUB_TOKEN 提交的，这类提交按规则不会触发其他工作流，
# 所以它 08-29 之后再没跑过。现在这里只负责两种情况：人手推送的前端改动，和手动重新部署
on:
  push:
    branches: [main]
    # 只在前端代码变化时触发——这类提交来自人，能正常触发。数据变化交给 daily.yml
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 与 daily.yml 的 deploy job 共用并发组
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
        env:
          AIRADAR_BASE: /airadar/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
